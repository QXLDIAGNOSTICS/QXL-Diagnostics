name: qxl_core
description: Shared core for the QXL patient and collector apps (API client, session, theme, widgets).
publish_to: 'none'
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^3.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.7
  url_launcher: ^6.3.3
  intl: ^0.20.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/brand/qxl_logo.png
    - assets/fonts/OFL.txt
  # Plus Jakarta Sans — the qxldiagnostics.com typeface (SIL OFL 1.1, see
  # assets/fonts/OFL.txt). Static weights cut from the variable font.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
